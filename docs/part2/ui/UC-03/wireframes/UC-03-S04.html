<title>UC-03-S04 New hub (wireframe)</title>
<link rel="stylesheet" href="../../_kit/wireframe.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <span class="brand">SaigonBite</span>
      <nav class="account" aria-label="Account"><span class="who">Admin<span class="role"> · Admin</span></span><button type="button" class="secondary">Log out</button></nav>
    </div>
    <div class="wrap"><nav class="mainnav" aria-label="Main"><a href="#">Hubs</a><a href="#">Brands and menu</a><a href="#">Vouchers</a><a href="#">Users</a><a href="#">Archive orders</a></nav></div>
  </header>
  <main id="content">
    <div class="wrap">
<div class="page-head">
  <h1>New hub</h1>
</div>
<form class="panel stack">
  <div class="field"><label for="f-code">Hub code <span class="hint">for example HUB-D3</span></label><input type="text" id="f-code" name="code" value="" required></div>
  <div class="field"><label for="f-name">Name</label><input type="text" id="f-name" name="name" value="" required></div>
  <div class="field"><label for="f-address_text">Address</label><input type="text" id="f-address_text" name="address_text" value="" required></div>
  <div class="two">
    <div class="field"><label for="f-latitude">Latitude</label><input type="number" id="f-latitude" name="latitude" value="" required step="0.0001"></div>
    <div class="field"><label for="f-longitude">Longitude</label><input type="number" id="f-longitude" name="longitude" value="" required step="0.0001"></div>
  </div>
  <div class="two">
    <div class="field"><label for="f-max_active_orders">Kitchen capacity (orders) <span class="hint">1 to 500</span></label><input type="number" id="f-max_active_orders" name="max_active_orders" value="" required min="1" max="500" step="1"></div>
    <div class="field"><label for="f-base_delivery_fee">Base delivery fee (VND) <span class="hint">plus 3,000 VND per km</span></label><input type="number" id="f-base_delivery_fee" name="base_delivery_fee" value="" required min="0" step="1000"></div>
  </div>
  <div class="actions"><button type="submit" data-goto="UC-03-S05" data-trigger="press button (capacity 600)">Save hub</button><a class="btn link" href="#" data-goto="UC-03-S01">Back</a></div>
</form>
    </div>
  </main>
  <footer>
    <div class="wrap">
      <p>Wireframe UC-03-S04 · New hub</p>

    </div>
  </footer>
</body>
</html>
