<div class="page-head">
  <h1>New hub</h1>
</div>
<div class="flash error" id="form-error" role="alert">The kitchen capacity must be between 1 and 500.</div>
<form class="panel stack">
  <div class="field"><label for="f-code">Hub code <span class="hint">for example HUB-D3</span></label><input type="text" id="f-code" name="code" value="HUB-D3" required></div>
  <div class="field"><label for="f-name">Name</label><input type="text" id="f-name" name="name" value="SaigonBite District 3 Hub" required></div>
  <div class="field"><label for="f-address_text">Address</label><input type="text" id="f-address_text" name="address_text" value="88 Vo Van Tan, Ward 6, District 3, Ho Chi Minh City" required></div>
  <div class="two">
    <div class="field"><label for="f-latitude">Latitude</label><input type="number" id="f-latitude" name="latitude" value="10.7790" required step="0.0001"></div>
    <div class="field"><label for="f-longitude">Longitude</label><input type="number" id="f-longitude" name="longitude" value="106.6860" required step="0.0001"></div>
  </div>
  <div class="two">
    <div class="field"><label for="f-max_active_orders">Kitchen capacity (orders) <span class="hint">1 to 500</span></label><input type="number" id="f-max_active_orders" name="max_active_orders" value="600" required min="1" max="500" step="1"></div>
    <div class="field"><label for="f-base_delivery_fee">Base delivery fee (VND) <span class="hint">plus 3,000 VND per km</span></label><input type="number" id="f-base_delivery_fee" name="base_delivery_fee" value="12000" required min="0" step="1000"></div>
  </div>
  <div class="actions"><button type="submit">Save hub</button><a class="btn link" href="#" data-goto="UC-03-S01">Back</a></div>
</form>
