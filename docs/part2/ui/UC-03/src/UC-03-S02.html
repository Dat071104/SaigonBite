title: Edit a hub

<div class="page-head">
  <h1>{{p:Hub name||SaigonBite District 1 Hub}}</h1>
  <p class="muted">Load now {{p:Load||1}} of {{p:Capacity||12}} · {{p:Open orders||2}} open order(s)</p>
</div>
<form class="panel stack">
  <div class="field"><label for="f-code">Hub code <span class="hint">for example HUB-D3</span></label><input type="text" id="f-code" name="code" value="HUB-D1" required></div>
  <div class="field"><label for="f-name">Name</label><input type="text" id="f-name" name="name" value="SaigonBite District 1 Hub" required></div>
  <div class="field"><label for="f-address_text">Address</label><input type="text" id="f-address_text" name="address_text" value="45 Le Loi, Ben Nghe Ward, District 1, Ho Chi Minh City" required></div>
  <div class="two">
    <div class="field"><label for="f-latitude">Latitude</label><input type="number" id="f-latitude" name="latitude" value="10.7769" required step="0.0001"></div>
    <div class="field"><label for="f-longitude">Longitude</label><input type="number" id="f-longitude" name="longitude" value="106.7009" required step="0.0001"></div>
  </div>
  <div class="two">
    <div class="field"><label for="f-max_active_orders">Kitchen capacity (orders) <span class="hint">1 to 500</span></label><input type="number" id="f-max_active_orders" name="max_active_orders" value="12" required min="1" max="500" step="1"></div>
    <div class="field"><label for="f-base_delivery_fee">Base delivery fee (VND) <span class="hint">plus 3,000 VND per km</span></label><input type="number" id="f-base_delivery_fee" name="base_delivery_fee" value="12000" required min="0" step="1000"></div>
  </div>
  <div class="actions"><button type="submit" data-goto="UC-03-S03">Save hub</button><a class="btn link" href="#" data-goto="UC-03-S01">Back</a></div>
</form>
<p class="muted">This hub can be archived once its {{p:Open orders||2}} open order(s) are finished.</p>
