services:
  web:
    build: .
    image: saigonbite:i1
    ports:
      - "5000:5000"
    environment:
      SAIGONBITE_SECRET_KEY: ${SAIGONBITE_SECRET_KEY:-dev-only-secret-change-me}
    volumes:
      - saigonbite-db:/app/instance

  tests:
    image: saigonbite:i1
    build: .
    command: ["python", "-m", "pytest", "-q"]
    profiles: ["test"]

volumes:
  saigonbite-db:
