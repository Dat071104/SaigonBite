{% extends "base.html" %}
{% block title %}Log in · SaigonBite{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Log in</h1>
  {% if error %}<div class="flash error" role="alert" style="margin-top:24px">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}" data-once style="margin-top:24px">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" autofocus required>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <div class="actions" style="margin-top:24px">
      <button type="submit" data-busy="Logging in...">Log in</button>
    </div>
  </form>
  <p class="muted" style="margin-top:24px">Demo accounts: customer, kitchen, shipper, admin or manager, all with the password 123456. Only the customer account can order.</p>
</div>
{% endblock %}
