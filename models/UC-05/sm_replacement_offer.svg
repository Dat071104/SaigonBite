x="815.0" y="516.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="555.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">DECLINED</tspan></text><circle cx="1065" cy="190" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1065" cy="190" r="9.0" fill="#004387"/><circle cx="1065" cy="550" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1065" cy="550" r="9.0" fill="#004387"/><rect x="300" y="90" width="500" height="80" fill="white"/><text x="550.0" y="115.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">offerReplacement [§3.3 1–3: own PLACED order;</tspan><tspan x="550.0" dy="20">source unavailable; no open offer; eligible target]</tspan><tspan x="550.0" dy="20">/ snapshot original/new names and prices; offered_at</tspan></text><rect x="355" y="225" width="455" height="100" fill="white"/><text x="582.5" y="250.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="582.5" dy="0">acceptReplacement [own PLACED; exact open offer;</tspan><tspan x="582.5" dy="20">target still active/listed/available]</tspan><tspan x="582.5" dy="20">/ ACCEPTED; decided_at; line and totals updated;</tspan><tspan x="582.5" dy="20">quantity + offered price honoured; Payment per §3.3 7</tspan></text><rect x="355" y="435" width="455" height="80" fill="white"/><text x="582.5" y="460.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="582.5" dy="0">declineReplacement [own order; exact open offer]</tspan><tspan x="582.5" dy="20">/ DECLINED; decided_at; Order REJECTED;</tspan><tspan x="582.5" dy="20">reason=customer declined replacement; BR-17</tspan></text><text x="550.0" y="663.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">One OFFERED offer per order; resolved offers remain as history. Withdrawals: Figure 2.7B.</tspan><tspan x="550.0" dy="20">A later new offer has its own identity; stale/repeated answers change no Order facts.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>