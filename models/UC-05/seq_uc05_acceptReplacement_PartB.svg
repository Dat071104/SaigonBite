<text x="45" y="247.32" font-family="Arial" font-size="24" font-weight="normal" fill="#202B36">Valid acceptance continues atomically: use offered price, whole line, same quantity; Snew; Dnew=min(Dold,Snew), F/Q unchanged;</text>
<text x="45" y="274.92" font-family="Arial" font-size="24" font-weight="normal" fill="#202B36">Tnew=Snew−Dnew+F−Q. Read Order.total property, set offer ACCEPTED through data access. COD amount=Tnew; ONLINE state PAID, C</text>
<text x="45" y="302.52" font-family="Arial" font-size="24" font-weight="normal" fill="#202B36">unchanged, refund_amount=C−Tnew. Order stays PLACED (PC04), never auto-confirms. Any conditional 0-row/lock/write/commit failure →</text>
