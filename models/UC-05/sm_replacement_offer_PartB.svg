<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.7B. ReplacementOffer — withdrawal paths</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-05 owner · same OFFERED lifecycle as Figure 2.7A</tspan></text><polyline points="170,331 170,135 920,135 920,331" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="275,365 815,365" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="170,399 170,590 920,590 920,399" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="1025,365 1051,365" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><rect x="65.0" y="331.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="170" y="370.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="170" dy="0">OFFERED</tspan></text><rect x="815.0" y="331.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="370.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">WITHDRAWN</tspan></text><circle cx="1065" cy="365" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1065" cy="365" r="9.0" fill="#004387"/><rect x="320" y="165" width="490" height="80" fill="white"/><text x="565.0" y="200.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="565.0" dy="0">rejectOrder [own-hub PLACED; reason; open offer]</tspan><tspan x="565.0" dy="20">/ WITHDRAWN; decided_at; Order REJECTED; BR-17</tspan></text><rect x="325" y="285" width="480" height="60" fill="white"/><text x="565.0" y="310.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="565.0" dy="0">cancelOrder [own PLACED/CONFIRMED; open offer]</tspan><tspan x="565.0" dy="20">/ WITHDRAWN; decided_at; Order CANCELLED; BR-17</tspan></text><rect x="320" y="445" width="490" height="80" fill="white"/><text x="565.0" y="470.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="565.0" dy="0">acceptReplacement [own PLACED; exact open offer;</tspan><tspan x="565.0" dy="20">target now unlisted / unavailable / archived]</tspan><tspan x="565.0" dy="20">/ WITHDRAWN; decided_at; show reason; Order unchanged</tspan></text><text x="550.0" y="663.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">WITHDRAWN is terminal for this offer; it never revives a cancelled/rejected order.</tspan><tspan x="550.0" dy="20">Invalid-target acceptance withdraws the offer only; UC05-MG01 still preserves the Order.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>