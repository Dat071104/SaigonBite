<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.8D. HubMenuItem — unlist ends the listing</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-06 owner · same two listing states as Figure 2.8C · no new stored UNLISTED state</tspan></text><polyline points="275,185 850,185 850,365 926,365" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="275,545 850,545 850,365 926,365" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><rect x="65.0" y="151.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="170" y="190.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="170" dy="0">AVAILABLE</tspan></text><rect x="65.0" y="511.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="170" y="550.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="170" dy="0">SOLD_OUT</tspan></text><circle cx="940" cy="365" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="940" cy="365" r="9.0" fill="#004387"/><rect x="320" y="235" width="510" height="60" fill="white"/><text x="575.0" y="260.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="575.0" dy="0">unlistItemAtHub [listed pair; authorised admin]</tspan><tspan x="575.0" dy="20">/ delete HubMenuItem row; preserve order snapshots</tspan></text><rect x="320" y="435" width="510" height="60" fill="white"/><text x="575.0" y="460.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="575.0" dy="0">unlistItemAtHub [listed pair; authorised admin]</tspan><tspan x="575.0" dy="20">/ delete HubMenuItem row; preserve order snapshots</tspan></text><text x="550.0" y="663.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">Physical row deletion applies only to the listing; Brand/MenuItem use archive.</tspan><tspan x="550.0" dy="20">Listing is per hub; another hub’s listing is unchanged. New listing starts a new lifecycle.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>