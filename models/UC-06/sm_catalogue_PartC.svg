<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.8C. HubMenuItem — list and change availability</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-06 owner; SUC-06 staff support · availability belongs to a hub–item pair</tspan></text><polyline points="150,122 150,234" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="150,266 150,486" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="166,250 1020,250 1020,470 920,470 920,486" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="255,500 815,500" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="815,540 255,540" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><circle cx="150" cy="110" r="12.0" fill="#004387" stroke="#004387" stroke-width="2"/><polygon points="150,234.0 166.0,250 150,266.0 134.0,250" fill="white" stroke="#004387" stroke-width="2"/><rect x="45.0" y="486.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="150" y="525.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="150" dy="0">AVAILABLE</tspan></text><rect x="815.0" y="486.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="525.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">SOLD_OUT</tspan></text><rect x="290" y="95" width="750" height="60" fill="white"/><text x="665.0" y="120.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="665.0" dy="0">listItemAtHub [active parents; no duplicate]</tspan><tspan x="665.0" dy="20">/ validate the requested initial availability</tspan></text><rect x="175" y="280" width="300" height="60" fill="white"/><text x="325.0" y="295.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="325.0" dy="0">[available=true]</tspan><tspan x="325.0" dy="20">/ insert AVAILABLE listing</tspan><tspan x="325.0" dy="20">(is_available=true)</tspan></text><rect x="500" y="265" width="500" height="60" fill="white"/><text x="750.0" y="290.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="750.0" dy="0">[available=false]</tspan><tspan x="750.0" dy="20">/ insert SOLD_OUT listing (is_available=false)</tspan></text><rect x="280" y="350" width="530" height="80" fill="white"/><text x="545.0" y="375.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="545.0" dy="0">setListingAvailability | setMenuAvailability</tspan><tspan x="545.0" dy="20">[listed pair; authorised Admin / own-hub Kitchen; available=false]</tspan><tspan x="545.0" dy="20">/ is_available=false; new orders blocked</tspan></text><rect x="280" y="550" width="530" height="80" fill="white"/><text x="545.0" y="575.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="545.0" dy="0">setListingAvailability | setMenuAvailability</tspan><tspan x="545.0" dy="20">[listed pair; authorised Admin / own-hub Kitchen; available=true]</tspan><tspan x="545.0" dy="20">/ is_available=true; old order lines unchanged</tspan></text><text x="550.0" y="663.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">No MenuItem.SOLD_OUT state: the same item may be available at another hub.</tspan><tspan x="550.0" dy="20">Unlist removes this listing lifecycle (Figure 2.8D); archived parents remain blocked regardless of flag.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>