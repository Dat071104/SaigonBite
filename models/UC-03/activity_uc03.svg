udeArchived?) / getHub(hubId)</text><polygon points="175,285.0 235.0,320 175,355.0 115.0,320" fill="white" stroke="#004387" stroke-width="1.5"/><text x="175" y="325.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">Next?</text><rect x="385" y="285" width="640" height="70" rx="8" fill="white" stroke="#004387" stroke-width="1.5"/><text x="705.0" y="315.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">Read-only inspection</text><text x="705.0" y="335.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">No persistent rows changed</text><rect x="40" y="408" width="270" height="90" rx="8" fill="white" stroke="#004387" stroke-width="1.5"/><text x="175.0" y="438.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">3 / A02 / A03: submit</text><text x="175.0" y="458.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">createHub / updateHub /</text><text x="175.0" y="478.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">archiveHub</text><rect x="385" y="403" width="640" height="90" rx="8" fill="white" stroke="#004387" stroke-width="1.5"/><text x="705.0" y="423.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">4 / A02 / A03: Admin; required fields; unique code;</text><text x="705.0" y="443.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">valid coordinates; fee ≥ 0; integer capacity ≥ 1;</text><text x="705.0" y="463.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1B1B1B">archive: AC