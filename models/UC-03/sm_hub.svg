cy="365" r="9.0" fill="#004387"/><rect x="300" y="95" width="740" height="60" fill="white"/><text x="670.0" y="120.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="670.0" dy="0">createHub [unique code; valid coordinates/fee; capacity ≥ 1]</tspan><tspan x="670.0" dy="20">/ create ACTIVE Hub</tspan></text><rect x="375" y="470" width="690" height="60" fill="white"/><text x="720.0" y="495.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="720.0" dy="0">updateHub [valid code/coordinates/fee; capacity ≥ 1]</tspan><tspan x="720.0" dy="20">/ save attributes; existing orders retain snapshots</tspan></text><rect x="335" y="250" width="470" height="80" fill="white"/><text x="570.0" y="285.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="570.0" dy="0">archiveHub [BR-18: no open orders]</tspan><tspan x="570.0" dy="20">/ set archived_at; hide browse/checkout; preserve history</tspan></text><text x="550.0" y="653.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">Inside ACTIVE: load=count(PLACED, CONFIRMED, PREPARING); BUSY if load ≥ capacity.</tspan><tspan x="550.0" dy="20">QUIET if pre-insert load &lt; 25% capacity; these are derived classifications, never stored states.</tspan><tspan x="550.0" dy="20">Capacity may fall below load, never below 1; duplicate/invalid/unsafe archive → nothing changed.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>