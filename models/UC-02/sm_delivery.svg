<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.5A. Delivery — creation and atomic pickup</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-02 owner · Order/Delivery/Payment changes form one successful operation</tspan></text><polyline points="130,202 130,506" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="250,540 815,540" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><circle cx="130" cy="190" r="12.0" fill="#004387" stroke="#004387" stroke-width="2"/><rect x="10.0" y="506.0" width="240" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="130" y="545.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="130" dy="0">AWAITING_PICKUP</tspan></text><rect x="815.0" y="506.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="545.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">PICKED_UP</tspan></text><rect x="290" y="165" width="600" height="80" fill="white"/><text x="590.0" y="190.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="590.0" dy="0">markReady [own-hub Order PREPARING]</tspan><tspan x="590.0" dy="20">/ Order READY; ready_at;</tspan><tspan x="590.0" dy="20">insert one Delivery AWAITING_PICKUP</tspan></text><rect x="300" y="420" width="490" height="80" fill="white"/><text x="545.0" y="445.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="545.0" dy="0">takeDelivery [active shipper; Order READY; unassigned]</tspan><tspan x="545.0" dy="20">/ set shipper_id, picked_up_at;</tspan><tspan x="545.0" dy="20">Delivery PICKED_UP; Order OUT_FOR_DELIVERY</tspan></text><text x="550.0" y="663.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">PICKED_UP continues in Figure 2.5B; any active shipper can take any READY order.</tspan><tspan x="550.0" dy="20">A second shipper / stale pickup / invalid role changes 0 rows (UC02-MG01; BR-25).</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>