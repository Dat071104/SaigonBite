<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.3C. Order — cancellation window</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-01 owner · SUC-04 · cancellation and preparation are serialised</tspan></text><polyline points="285,185 790,185 790,345 815,345" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="285,545 790,545 790,385 815,385" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="1025,365 1051,365" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><rect x="75.0" y="151.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="180" y="190.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="180" dy="0">PLACED</tspan></text><rect x="75.0" y="511.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="180" y="550.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="180" dy="0">CONFIRMED</tspan></text><rect x="815.0" y="331.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="370.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">CANCELLED</tspan></text><circle cx="1065" cy="365" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1065" cy="365" r="9.0" fill="#004387"/><rect x="325" y="215" width="450" height="80" fill="white"/><text x="550.0" y="250.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">cancelOrder [own order; still PLACED]</tspan><tspan x="550.0" dy="20">/ offer WITHDRAWN; BR-17; set closed_at</tspan></text><rect x="325" y="440" width="450" height="80" fill="white"/><text x="550.0" y="475.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">cancelOrder [own order; still CONFIRMED]</tspan><tspan x="550.0" dy="20">/ offer WITHDRAWN; BR-17; set closed_at</tspan></text><text x="550.0" y="653.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">Views A–E project one Order lifecycle; repeated state names denote the same stored state.</tspan><tspan x="550.0" dy="20">Every event requires an active authorised actor; failed guards change no Order facts.</tspan><tspan x="550.0" dy="20">No cancel transition exists from PREPARING or later; terminal orders cannot be revived.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>