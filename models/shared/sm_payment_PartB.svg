<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.4B. Payment — ONLINE simulator</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-01 owner · C = amount captured at approved checkout; T = current order total</tspan></text><polyline points="140,122 140,331" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="140,399 140,595 330,595 330,385 245,385" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="245,345 295,345 295,540 795,540" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="1045,540 1056,540" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><circle cx="140" cy="110" r="12.0" fill="#004387" stroke="#004387" stroke-width="2"/><rect x="35.0" y="331.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="140" y="370.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="140" dy="0">PAID</tspan></text><rect x="795.0" y="506.0" width="250" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="545.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">REFUND_PENDING</tspan></text><rect x="795.0" y="106.0" width="250" height="88" rx="14" fill="#DCDCDC" stroke="#004387" stroke-width="2"/><text x="920" y="145.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">REFUNDED</tspan><tspan x="920" dy="20">Future payout only</tspan></text><circle cx="1070" cy="540" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1070" cy="540" r="9.0" fill="#004387"/><rect x="280" y="95" width="510" height="60" fill="white"/><text x="535.0" y="120.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="535.0" dy="0">confirmCheckout [ONLINE approved + saved]</tspan><tspan x="535.0" dy="20">/ insert Payment PAID; amount=C; refund_amount=0</tspan></text><rect x="350" y="265" width="450" height="80" fill="white"/><text x="575.0" y="290.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="575.0" dy="0">acceptReplacement [valid accepted offer]</tspan><tspan x="575.0" dy="20">/ remain PAID; amount=C unchanged;</tspan><tspan x="575.0" dy="20">refund_amount=C−T_new (owed, not paid)</tspan></text><rect x="345" y="410" width="445" height="120" fill="white"/><text x="567.5" y="435.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="567.5" dy="0">rejectOrder | declineReplacement |</tspan><tspan x="567.5" dy="20">cancelOrder | reportFailure</tspan><tspan x="567.5" dy="20">[valid unfulfilled terminal outcome; BR-17]</tspan><tspan x="567.5" dy="20">/ REFUND_PENDING; refund_amount=C</tspan><tspan x="567.5" dy="20">(replace any partial amount; do not add it)</tspan></text><text x="550.0" y="653.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">Declined attempt: message/log only, no Payment row and no persisted FAILED state.</tspan><tspan x="550.0" dy="20">REFUNDED has no incoming transition: payout is deferred (L3); final ends current model scope.</tspan><tspan x="550.0" dy="20">confirmDelivered [assigned shipper] / retain PAID, C and any partial refund owed.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>