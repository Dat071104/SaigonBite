acts.</tspan><tspan x="550.0" dy="20">BR-17: COD VOIDED; ONLINE REFUND_PENDING with refund_amount = captured C.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>