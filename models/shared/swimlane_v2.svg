span x="160" dy="0">A</tspan></text><rect x="280.0" y="105.0" width="650" height="60" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="605" y="130.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="605" dy="0">SUC-01 / 02 identity + addresses; UC-01 order;</tspan><tspan x="605" dy="19">SUC-03 tracking, offer answer and receipt; SUC-04 cancel</tspan></text><circle cx="160" cy="225" r="20.0" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="160" y="230.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="bold"><tspan x="160" dy="0">K</tspan></text><rect x="280.0" y="195.0" width="650" height="60" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="605" y="220.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="605" dy="0">UC-05 decide; SUC-05 prepare and mark READY;</tspan><tspan x="605" dy="19">SUC-06 availability at own hub</tspan></text><circle cx="160" cy="315" r="20.0" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="160" y="320.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="bold"><tspan x="160" dy="0">D</tspan></text><rect x="280.0" y="285.0" width="650" height="60" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="605" y="310.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="605" dy="0">UC-02 take READY order; deliver with exact COD cash,</tspan><tspan x="605" dy="19">or report failure; only assigned shipper may finish</tspan></text><circle cx="160" cy="405" r="12.0" fill="#004387"/><rect x="280.0" y="375.0" width="650" height="60" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="605" y="400.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="605" dy="0">UC-03 hubs; UC-06 catalogue; SUC-07 vouchers;</tspan><tspan x="605" dy="19">SUC-08 accounts; SUC-09 archive closed orders (Part G)</tspan></text><circle cx="1035" cy="405" r="12.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1035" cy="405" r="7.0" fill="#004387"/><circle cx="160" cy="495" r="12.0" fill="#004387"/><rect x="280.0" y="465.0" width="650" height="60" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="605" y="490.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="605" dy="0">UC-04 request sales, hub workload and delivery reports</tspan><tspan x="605" dy="19">Independent read-only activity (Part G)</tspan></text><circle cx="1035" cy="495" r="12.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1035" cy="495" r="7.0" fill="#004387"/><rect x="280.0" y="555.0" width="650" height="60" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="605" y="580.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="605" dy="0">Parts A-F: price, capacity, consent, payment simulator,</tspan><tspan x="605" dy="19">atomic state changes, privacy, history and receipts</tspan></text><text x="145" y="657.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="145" dy="0">Initial = filled dot; activity final = ring + dot (whole activity); flow final = circle + X (one path).</tspan></text><text x="145" y="677.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="145" dy="0">A: checkout · K: PLACED kitchen decision · R: offer response · D: READY delivery.</tspan></text><text x="20" y="720.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="20" y="746.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Blue/white: Part 2 scope · Red: exception · Grey: deferred, not built (L3 / A-09)</tspan></text></svg>