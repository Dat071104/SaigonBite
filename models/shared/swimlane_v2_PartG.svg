ight="normal"><tspan x="145" dy="0">Hub archive: no open orders. Accounts: ACTIVE / INACTIVE; a shipper with PICKED_UP work cannot be deactivated.</tspan></text><text x="20" y="720.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="20" y="746.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Blue/white: Part 2 scope · Red: exception · Grey: deferred, not built (L3 / A-09)</tspan></text></svg>