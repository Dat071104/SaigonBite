<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.3E. Order — delivered or delivery failed</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-01 owner; shared by UC-02 · four terminal Order states appear across A/C/E</tspan></text><polyline points="310,365 350,365 350,170 815,170" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="310,365 350,365 350,550 800,550" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="1025,170 1054,170" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="1040,550 1054,550" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><rect x="50.0" y="331.0" width="260" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="180" y="370.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="180" dy="0">OUT_FOR_DELIVERY</tspan></text><rect x="815.0" y="136.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="175.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">DELIVERED</tspan></text><rect x="800.0" y="516.0" width="240" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="920" y="555.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="920" dy="0">DELIVERY_FAILED</tspan></text><circle cx="1068" cy="170" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1068" cy="170" r="9.0" fill="#004387"/><circle cx="1068" cy="550" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1068" cy="550" r="9.0" fill="#004387"/><rect x="385" y="210" width="410" height="100" fill="white"/><text x="590.0" y="235.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="590.0" dy="0">confirmDelivered</tspan><tspan x="590.0" dy="20">[assigned active shipper; COD cash = T]</tspan><tspan x="590.0" dy="20">/ Delivery DELIVERED; set finished_at, closed_at;</tspan><tspan x="590.0" dy="20">COD PAID; record exact cash; ONLINE stays PAID</tspan></text><rect x="375" y="410" width="420" height="100" fill="white"/><text x="585.0" y="435.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="585.0" dy="0">reportFailure [assigned active shipper; reason]</tspan><tspan x="585.0" dy="20">/ Delivery FAILED + reason; finished_at, closed_at;</tspan><tspan x="585.0" dy="20">COD VOIDED or ONLINE REFUND_PENDING;</tspan><tspan x="585.0" dy="20">ONLINE refund_amount = captured C (BR-17)</tspan></text><text x="550.0" y="653.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">Views A–E project one Order lifecycle; repeated state names denote the same stored state.</tspan><tspan x="550.0" dy="20">Every event requires an active authorised actor; failed guards change no Order facts.</tspan><tspan x="550.0" dy="20">Terminal states: DELIVERED, DELIVERY_FAILED, REJECTED, CANCELLED; no redelivery loop.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>