<tspan x="82" dy="30.939999999999998">† P2-S03: TOURIST CHECK requires passport_no and email; nationality IS NOT NULL is absent at C0.</tspan>
<tspan x="82" dy="30.939999999999998">† P2-S07: customer.user_id is FK + UNIQUE, but SQL does not require the linked user_account.role = CUSTOMER.</tspan>
