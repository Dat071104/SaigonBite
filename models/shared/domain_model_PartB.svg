<text x="30" y="18" fill="#202B36" font-family="Arial, sans-serif" font-size="34" font-weight="700" dominant-baseline="hanging">
<tspan x="30" dy="0">Domain model · catalogue, hub listings and vouchers</tspan>
</text>
<text x="30" y="1244" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="30" dy="0">Figure 2.2B · Author: 722I0004 · AI-assisted (Codex)</tspan>
</text>
<text x="30" y="1275" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="30" dy="0">Analysis model · team defaults; no lecturer approval or runtime result inferred</tspan>
</text>
<text x="1050" y="710" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="1050" dy="0">HubMenuItem is the association class of</tspan>
<tspan x="1050" dy="30.939999999999998">Hub ↔ MenuItem (one row per pair).</tspan>
<tspan x="1050" dy="30.939999999999998">Listed row absent = unlisted.</tspan>
<tspan x="1050" dy="30.939999999999998">Available = true / false is per hub.</tspan>
</text>
<text x="1050" y="895" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="1050" dy="0">Catalogue archive never rewrites order snapshots.</tspan>
<tspan x="1050" dy="30.939999999999998">Archived brand or item cannot be ordered.</tspan>
<tspan x="1050" dy="30.939999999999998">Hub details appear in Figure 2.2A.</tspan>
<tspan x="1050" dy="30.939999999999998">Voucher → Order appears in Figure 2.2C.</tspan>
</text>
<text x="60" y="1105" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="60" dy="0">Quote, report filters/rows and receipts are computed views; they are not persistent classes.</tspan>
</text>
<text x="490" y="240" fill="#004387" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="490" dy="0">offers</tspan>
