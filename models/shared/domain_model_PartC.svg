<text x="700" y="735" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="700" dy="0">S − D + F − Q = T (snapshots).</tspan>
<tspan x="700" dy="30.939999999999998">ONLINE amount = captured C.</tspan>
<tspan x="700" dy="30.939999999999998">refund_amount = owed, not paid.</tspan>
<tspan x="700" dy="30.939999999999998">One OFFERED offer per Order.</tspan>
<tspan x="700" dy="30.939999999999998">Offer/line share the same Order.</tspan>
<tspan x="700" dy="30.939999999999998">REFUNDED/payout deferred (L3).</tspan>
</text>
