<text x="82" y="942" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="82" dy="0">Order 1–0..1 Payment and Order 1–0..1 Delivery are SQL maxima; successful checkout / markReady supplies required rows.</tspan>
<tspan x="82" dy="30.939999999999998">Payment.amount is COD due or captured ONLINE amount C; refund_amount is owed, not paid. All event timestamps are UTC.</tspan>
<tspan x="82" dy="30.939999999999998">Payment.updated_at is SQL NOT NULL; PaymentDAO.insert uses updated_at or created_at (P2-S08), so this is not a gap.</tspan>
<tspan x="82" dy="30.939999999999998">FAILED / REFUNDED remain SQL/enum values but are deferred or unreachable per P2-S01; no payout is drawn.</tspan>
<tspan x="82" dy="30.939999999999998">Continuation: Order resolves to PartC; UserAccount resolves to PartA; replacement offers continue in PartE.</tspan>
</text>
