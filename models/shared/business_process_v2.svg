<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B03A2E"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="20" y="33.480000000000004" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="20" dy="0">1.5 Business process - SaigonBite Part 2</tspan></text><text x="20" y="65.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Order journey above; enabling operations below. Scope is planned; this figure is not test evidence.</tspan></text><polyline points="335.0,145 385.0,145" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="565.0,145 615.0,145" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="795.0,145 845.0,145" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="935,182.5 935,262.5" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="845.0,300 795.0,300" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="475,182.5 475,262.5" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="245,262.5 245,200 705,200 705,182.5" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="705,337.5 705,360 575,360 575,530 475,530 475,547.5" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="705,337.5 705,355 345,355 345,530 245,530 245,547.5" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="565.0,585 615.0,585" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><polyline points="795.0,585 845.0,585" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#arrow)"/><rect x="155.0" y="107.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="245" y="131.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="245" dy="0">SUC-01 / SUC-02</tspan><tspan x="245" dy="19">Sign in; register;</tspan><tspan x="245" dy="19">profile and addresses</tspan></text><rect x="385.0" y="107.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="475" y="131.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="475" dy="0">UC-01</tspan><tspan x="475" dy="19">Accept full quote</tspan><tspan x="475" dy="19">and place order</tspan></text><rect x="615.0" y="107.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="705" y="131.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="705" dy="0">UC-05</tspan><tspan x="705" dy="19">Confirm, reject or</tspan><tspan x="705" dy="19">offer replacement</tspan></text><rect x="845.0" y="107.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="935" y="131.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="935" dy="0">SUC-05</tspan><tspan x="935" dy="19">Start PREPARING;</tspan><tspan x="935" dy="19">mark READY</tspan></text><rect x="155.0" y="262.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="245" y="286.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="245" dy="0">SUC-06</tspan><tspan x="245" dy="19">Set availability</tspan><tspan x="245" dy="19">at own hub</tspan></text><rect x="385.0" y="262.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="475" y="286.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="475" dy="0">SUC-04</tspan><tspan x="475" dy="19">Cancel PLACED</tspan><tspan x="475" dy="19">or CONFIRMED</tspan></text><rect x="615.0" y="262.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="705" y="286.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="705" dy="0">SUC-03</tspan><tspan x="705" dy="19">Track; answer offer;</tspan><tspan x="705" dy="19">view receipt</tspan></text><rect x="845.0" y="262.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="935" y="286.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="935" dy="0">UC-02</tspan><tspan x="935" dy="19">Pick up; deliver +</tspan><tspan x="935" dy="19">cash; report failure</tspan></text><rect x="155.0" y="412.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="245" y="436.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="245" dy="0">UC-03</tspan><tspan x="245" dy="19">Maintain hubs</tspan><tspan x="245" dy="19">and capacity</tspan></text><rect x="385.0" y="412.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="475" y="436.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="475" dy="0">UC-06</tspan><tspan x="475" dy="19">Maintain brands,</tspan><tspan x="475" dy="19">items, hub listings</tspan></text><rect x="615.0" y="412.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="705" y="436.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="705" dy="0">SUC-07 / SUC-08</tspan><tspan x="705" dy="19">Maintain vouchers</tspan><tspan x="705" dy="19">and user accounts</tspan></text><rect x="845.0" y="412.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="935" y="436.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="935" dy="0">UC-04 / SUC-09</tspan><tspan x="935" dy="19">Reports; archive +</tspan><tspan x="935" dy="19">read archived history</tspan></text><rect x="155.0" y="547.5" width="180" height="75" rx="12" fill="#DCDCDC" stroke="#004387" stroke-width="2"/><text x="245" y="571.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="245" dy="0">Rate food and</tspan><tspan x="245" dy="19">delivery</tspan><tspan x="245" dy="19">DEFERRED</tspan></text><rect x="385.0" y="547.5" width="180" height="75" rx="12" fill="#DCDCDC" stroke="#004387" stroke-width="2"/><text x="475" y="571.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="475" dy="0">Complain about</tspan><tspan x="475" dy="19">wrong / late order</tspan><tspan x="475" dy="19">DEFERRED</tspan></text><rect x="615.0" y="547.5" width="180" height="75" rx="12" fill="#DCDCDC" stroke="#004387" stroke-width="2"/><text x="705" y="571.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="705" dy="0">Decide a</tspan><tspan x="705" dy="19">complaint refund</tspan><tspan x="705" dy="19">DEFERRED</tspan></text><rect x="845.0" y="547.5" width="180" height="75" rx="12" fill="#DCDCDC" stroke="#004387" stroke-width="2"/><text x="935" y="571.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="935" dy="0">Pay out a</tspan><tspan x="935" dy="19">refund owed</tspan><tspan x="935" dy="19">DEFERRED</tspan></text><rect x="770.96875" y="193.5" width="98.0625" height="23.0" fill="white"/><text x="820.0" y="210.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="820.0" dy="0">[confirmed]</tspan></text><rect x="418.8125" y="211.0" width="112.375" height="23.0" fill="white"/><text x="475.0" y="227.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="475.0" dy="0">[early cancel]</tspan></text><rect x="773.6328125" y="513.5" width="92.734375" height="23.0" fill="white"/><text x="820.0" y="530.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="820.0" dy="0">[approved]</tspan></text><text x="145" y="657.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="145" dy="0">Future, not implemented: loyalty, subscriptions, group orders and scheduled orders (case p.2).</tspan></text><text x="145" y="677.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="145" dy="0">Refund liability is recorded in scope; the grey payout step does not execute in this release.</tspan></text><text x="20" y="720.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="20" y="746.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Blue/white: Part 2 scope · Red: exception · Grey: deferred, not built (L3 / A-09)</tspan></text></svg>