<text x="30" y="18" fill="#202B36" font-family="Arial, sans-serif" font-size="34" font-weight="700" dominant-baseline="hanging">
<tspan x="30" dy="0">Domain model · identity, addresses and hub responsibility</tspan>
</text>
<text x="30" y="1284" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="30" dy="0">Figure 2.2A · Author: 722I0004 · AI-assisted (Codex)</tspan>
</text>
<text x="30" y="1315" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="30" dy="0">Analysis model · team defaults; no lecturer approval or runtime result inferred</tspan>
</text>
<text x="740" y="315" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="740" dy="0">Customer: {complete, disjoint}.</tspan>
<tspan x="740" dy="30.939999999999998">One CUSTOMER account per customer.</tspan>
<tspan x="740" dy="30.939999999999998">Other roles have no Customer profile.</tspan>
</text>
<text x="640" y="970" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="640" dy="0">Shipper is a UserAccount role (SHIPPER), not another class.</tspan>
<tspan x="640" dy="30.939999999999998">A kitchen account has exactly one Hub; all other roles have none.</tspan>
<tspan x="640" dy="30.939999999999998">Busy / quiet / workload are derived, never persisted Hub states.</tspan>
</text>
<text x="640" y="1100" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="640" dy="0">? = optional value; money = Integer whole VND.</tspan>
<tspan x="640" dy="30.939999999999998">Dates use Date; timestamps use DateTime (UTC).</tspan>
<tspan x="640" dy="30.939999999999998">No methods or foreign-key attributes appear in this analysis model.</tspan>
</text>
<text x="615" y="165" fill="#004387" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
