240" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="160" y="555.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="160" dy="0">OUT_FOR_DELIVERY</tspan></text><rect x="310" y="175" width="470" height="60" fill="white"/><text x="545.0" y="200.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="545.0" dy="0">startPreparing [own hub; no open offer]</tspan><tspan x="545.0" dy="20">/ set Order PREPARING</tspan></text><rect x="500" y="300" width="405" height="80" fill="white"/><text x="702.5" y="325.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="702.5" dy="0">markReady [own hub]</tspan><tspan x="702.5" dy="20">/ set ready_at; insert exactly one</tspan><tspan x="702.5" dy="20">Delivery AWAITING_PICKUP</tspan></text><rect x="305" y="440" width="500" height="80" fill="white"/><text x="555.0" y="465.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="555.0" dy="0">takeDelivery [active shipper; delivery unassigned]</tspan><tspan x="555.0" dy="20">/ Delivery PICKED_UP; shipper_id; picked_up_at;</tspan><tspan x="555.0" dy="20">Order OUT_FOR_DELIVERY</tspan></text><text x="550.0" y="653.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">Views A–E project one Order lifecycle; repeated state names denote the same stored state.</tspan><tspan x="550.0" dy="20">Every event requires an active authorised actor; failed guards change no Order facts.</tspan><tspan x="550.0" dy="20">READY and OUT_FOR_DELIVERY leave cooking load (BR-01); pickup has exactly one winner.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>