<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#004387"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="550.0" y="35.480000000000004" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Figure 2.3B. Order — replacement response</tspan></text><text x="550.0" y="67.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">UC-01 / UC-05 / SUC-03 · internal transitions retain Order.PLACED</tspan></text><polyline points="190,331 190,115 325,115 325,345 295,345" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="295,365 820,365" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="190,399 190,605 325,605 325,385 295,385" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><polyline points="1030,365 1051,365" fill="none" stroke="#004387" stroke-width="2" marker-end="url(#a)" /><rect x="85.0" y="331.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="190" y="370.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="190" dy="0">PLACED</tspan></text><rect x="820.0" y="331.0" width="210" height="68" rx="14" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="925" y="370.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="925" dy="0">REJECTED</tspan></text><circle cx="1065" cy="365" r="14.0" fill="white" stroke="#004387" stroke-width="2"/><circle cx="1065" cy="365" r="9.0" fill="#004387"/><rect x="395" y="95" width="670" height="100" fill="white"/><text x="730.0" y="120.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="730.0" dy="0">offerReplacement</tspan><tspan x="730.0" dy="20">[own-hub PLACED; source unavailable; no open offer;</tspan><tspan x="730.0" dy="20">active/listed/available different target; price ≤ source]</tspan><tspan x="730.0" dy="20">/ insert one OFFERED offer; preserve line and totals</tspan></text><rect x="330" y="275" width="460" height="80" fill="white"/><text x="560.0" y="300.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="560.0" dy="0">declineReplacement [exact open offer; own order]</tspan><tspan x="560.0" dy="20">/ offer DECLINED; REJECTED; rejection reason;</tspan><tspan x="560.0" dy="20">BR-17; set closed_at</tspan></text><rect x="395" y="465" width="670" height="120" fill="white"/><text x="730.0" y="490.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="730.0" dy="0">acceptReplacement [own order; exact open offer;</tspan><tspan x="730.0" dy="20">PLACED; target still active/listed/available]</tspan><tspan x="730.0" dy="20">/ offered-price line; quantity unchanged; offer ACCEPTED;</tspan><tspan x="730.0" dy="20">D_new=min(D_old,S_new); F,Q unchanged; recompute T;</tspan><tspan x="730.0" dy="20">COD amount=T; ONLINE PAID, amount=C, refund_amount=C−T</tspan></text><text x="550.0" y="653.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">Views A–E project one Order lifecycle; repeated state names denote the same stored state.</tspan><tspan x="550.0" dy="20">Every event requires an active authorised actor; failed guards change no Order facts.</tspan><tspan x="550.0" dy="20">Waiting for customer = PLACED + an OFFERED offer; it is a derived label, not a state.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>