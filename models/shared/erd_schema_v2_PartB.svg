<text x="82" y="1022" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="82" dy="0">hub_menu_item is the Hub–MenuItem association class; its composite PK is (hub_id, menu_item_id).</tspan>
<tspan x="82" dy="30.939999999999998">UNIQUE: menu_item(brand_id, name); hub_menu_item(hub_id, menu_item_id) PK; brand.name and voucher.code.</tspan>
<tspan x="82" dy="30.939999999999998">An absent hub_menu_item row is unlisted; is_available is per hub. Order snapshots retain historical names/prices.</tspan>
<tspan x="82" dy="30.939999999999998">Continuation: Hub resolves to PartA; orders/lines continue in PartC; payment/delivery and replacement offers in PartsD/E.</tspan>
