" fill="#1B1B1B" font-weight="normal"><tspan x="960" dy="0">Show approximate</tspan><tspan x="960" dy="19">distance, S, D, F, Q, T</tspan><tspan x="960" dy="19">and payment options</tspan></text><rect x="870.0" y="117.5" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="960" y="150.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="960" dy="0">Review full quote</tspan><tspan x="960" dy="19">and choose payment</tspan></text><circle cx="960" cy="270" r="20.0" fill="#FFFFFF" stroke="#004387" stroke-width="2"/><text x="960" y="275.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="bold"><tspan x="960" dy="0">P</tspan></text><rect x="430.0" y="477.5" width="180" height="75" rx="12" fill="#FBEDEB" stroke="#B03A2E" stroke-width="2"/><text x="520" y="510.94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="520" dy="0">Refuse: beyond</tspan><tspan x="520" dy="19">raw 8 km radius</tspan></text><circle cx="520" cy="605" r="12.0" fill="white" stroke="#004387" stroke-width="2"/><path d="M513,598L527,612M513,612L527,598" stroke="#004387" stroke-width="2"/><rect x="650.0" y="477.5" width="180" height="75" rx="12" fill="#FBEDEB" stroke="#B03A2E" stroke-width="2"/><text x="740" y="501.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="740" dy="0">Refuse this hub;</tspan><tspan x="740" dy="19">suggest up to 3</tspan><tspan x="740" dy="19">quieter hubs</tspan></text><circle cx="740" cy="605" r="12.0" fill="white" stroke="#004387" stroke-width="2"/><path d="M733,598L747,612M733,612L747,598" stroke="#004387" stroke-width="2"/><rect x="582.734375" y="401.5" width="94.53125" height="23.0" fill="white"/><text x="630.0" y="418.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="630.0" dy="0">[d &lt;= 8 km]</tspan></text><rect x="477.40625" y="444.75" width="85.1875" height="23.0" fill="white"/><text x="520.0" y="461.69" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B03A2E" font-weight="bold"><tspan x="520.0" dy="0">[d &gt; 8 km]</tspan></text><rect x="803.8125" y="433.5" width="87.375" height="23.0" fill="white"/><text x="847.5" y="450.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="847.5" dy="0">[not busy]</tspan></text><rect x="710.984375" y="444.75" width="58.03125" height="23.0" fill="white"/><text x="740.0" y="461.69" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B03A2E" font-weight="bold"><tspan x="740.0" dy="0">[busy]</tspan></text><text x="145" y="657.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="145" dy="0">P continues at Part B. Refused attempts end; changing hub/address starts a new quote.</tspan></text><text x="145" y="677.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="145" dy="0">Busy = load &gt;= capacity; quiet incentive = load &lt; 25% before insertion. Both are derived (BR-01-10).</tspan></text><text x="20" y="720.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="20" y="746.44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="20" dy="0">Blue/white: Part 2 scope · Red: exception · Grey: deferred, not built (L3 / A-09)</tspan></text></svg>