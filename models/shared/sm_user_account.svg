ext x="610" y="580.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="610" dy="0">Unreachable in Part 2</tspan><tspan x="610" dy="20">(no account-end operation)</tspan></text><rect x="300" y="90" width="680" height="80" fill="white"/><text x="640.0" y="115.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="640.0" dy="0">registerCustomer | createUserAccount</tspan><tspan x="640.0" dy="20">[valid unique identity; role/hub valid]</tspan><tspan x="640.0" dy="20">/ create is_active=true</tspan></text><rect x="315" y="225" width="485" height="100" fill="white"/><text x="557.5" y="260.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="557.5" dy="0">setUserActive [active=false; Admin; BR-25:</tspan><tspan x="557.5" dy="20">no PICKED_UP delivery assigned to target shipper]</tspan><tspan x="557.5" dy="20">/ is_active=false; reject existing session on next request</tspan></text><rect x="315" y="430" width="485" height="60" fill="white"/><text x="557.5" y="455.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="557.5" dy="0">setUserActive [active=true; authorised Admin]</tspan><tspan x="557.5" dy="20">/ is_active=true; subsequent valid login permitted</tspan></text><text x="550.0" y="653.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B1B1B" font-weight="normal"><tspan x="550.0" dy="0">updateUserAccount [valid Admin change] / attributes only; activation state does not change.</tspan><tspan x="550.0" dy="20">INACTIVE is reversible. No account deletion/end event exists; the shown final is unreachable.</tspan><tspan x="550.0" dy="20">BR-25 deactivation guard is checked atomically; inactive-account session fails on its next request.</tspan></text><text x="550.0" y="721.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="bold"><tspan x="550.0" dy="0">Author: 722I0004 · AI-assisted (Codex)</tspan></text><text x="550.0" y="747.44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#004387" font-weight="normal"><tspan x="550.0" dy="0">Filled dot: initial · Bullseye: final · Grey: future/unreachable · Labels: event [guard] / effect</tspan></text></svg>