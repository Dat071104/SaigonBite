<text x="76" y="195" fill="#202B36" font-family="Arial, sans-serif" font-size="30" font-weight="400" dominant-baseline="hanging">
<tspan x="76" dy="0">• Owner / management — oversight</tspan>
</text>
<text x="76" y="233" fill="#202B36" font-family="Arial, sans-serif" font-size="30" font-weight="400" dominant-baseline="hanging">
<tspan x="76" dy="0">• Hub managers — capacity</tspan>
</text>
<text x="76" y="271" fill="#202B36" font-family="Arial, sans-serif" font-size="30" font-weight="400" dominant-baseline="hanging">
