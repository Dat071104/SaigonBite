<text x="50" y="22" fill="#004387" font-family="Arial, sans-serif" font-size="42" font-weight="700" dominant-baseline="hanging">
<tspan x="50" dy="0">SaigonBite client stakeholders</tspan>
</text>
<text x="50" y="75" fill="#52616F" font-family="Arial, sans-serif" font-size="28" font-weight="400" dominant-baseline="hanging">
<tspan x="50" dy="0">Grouped by OFDH interaction; formal reporting lines are not assumed.</tspan>
</text>
<rect x="50" y="100.0" width="600" height="280" rx="18" fill="#E7F0F6" stroke="#6C8EBF" stroke-width="3"/>
<text x="74" y="118.0" fill="#185695" font-family="Arial, sans-serif" font-size="34" font-weight="700" dominant-baseline="hanging">
<tspan x="74" dy="0">Operations</tspan>
</text>
<text x="76" y="170.0" fill="#202B36" font-family="Arial, sans-serif" font-size="28" font-weight="400" dominant-baseline="hanging">
<tspan x="76" dy="0">• Owner / management — oversight</tspan>
</text>
<text x="76" y="204.0" fill="#202B36" font-family="Arial, sans-serif" font-size="28" font-weight="400" dominant-baseline="hanging">
<tspan x="76" dy="0">• Hub managers — capacity</tspan>
</text>
<text x="76" y="238.0" fill="#202B36" font-family="Arial, sans-serif" font-size="28" font-weight="400" dominant-baseline="hanging">
<tspan x="76" dy="0">• Kitchen staff — orders, prep, availability</tspan>
</text>
<text x="76" y="272.0" fill="#202B36" font-family="Arial, sans-serif" font-size="28" font-weight="400" dominant-baseline="hanging">
<tspan x="76" dy="0">• Shippers — pickup, cash, delivery</tspan>
</text>
<text x="76" y="306.0" fill="#202B36" font-family="Arial, sans-serif" font-size="28" font-weight="400" dominant-baseline="hanging">
<tspan x="76" dy="0">outcome</tspan>
</text>
<rect x="50" y="440.0" width="600" height="280" rx="18" fill="#E7F0F6" stroke="#6C8EBF" stroke-width="3"/>
<text x="74" y="458.0" fill="#185695" font-family="Arial, sans-serif" font-size="34" font-weight="700" dominant-baseline="hanging">
