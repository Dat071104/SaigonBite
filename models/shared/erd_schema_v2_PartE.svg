<text x="82" y="942" fill="#202B36" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="hanging">
<tspan x="82" dy="0">idx_offer_one_open is UNIQUE on order_id only WHERE state = &#x27;OFFERED&#x27;; all resolved offers remain history.</tspan>
<tspan x="82" dy="30.939999999999998">SQL does not require offer.order_id to match order_line.order_id or recheck target eligibility at the same hub (P2-S09).</tspan>
<tspan x="82" dy="30.939999999999998">Original/new names and prices are snapshots; only new_menu_item_id references the current target item.</tspan>
<tspan x="82" dy="30.939999999999998">Offer timestamps are UTC. No withdrawal_reason column or separate Shipper table exists in schema v2.</tspan>
<tspan x="82" dy="30.939999999999998">Continuation: Order and OrderLine resolve to PartC; target MenuItem resolves to PartB; payment history is in PartD.</tspan>
